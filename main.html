<lcars>
  <!-- URL bar. The field owns the request: lc-get="#url_input" means "the
       url is my own text", lc-trigger="enter" submits it on Enter instead of
       inserting a newline. GO carries no url of its own - lc-from presses the
       field's control, so the address is written down exactly once. -->
  <lcars-text-editor id="url_input" x="210", y="10", w="500", h="32", size="32"
                     lc-get="#url_input" lc-trigger="enter">file://main.html</lcars-text-editor>
  <lcars-button x="690" y="10" w="90" h="62" color="yellow" lc-from="url_input">GO</lcars-button>

  <!-- Upper Elbow and Header -->
  <lcars-rectangle id="sphere_status" x="0" y="4" w="200" h="96" color="purple"></lcars-rectangle>
  <lcars-elbow x="0" y="104" w="200" h="40" color="blue" orientation="3"></lcars-elbow>
  <lcars-text x="784" y="4" size="48" color="yellow">LCARS ACCESS 441</lcars-text>

  <!-- Top Bar Segments -->
  <lcars-rectangle x="606" y="184" w="40" h="20" color="orange"></lcars-rectangle>
  <lcars-rectangle x="652" y="184" w="140" h="20" color="purple"></lcars-rectangle>
  <lcars-rectangle x="798" y="184" w="400" h="20" color="purple"></lcars-rectangle>
  <lcars-rectangle x="1204" y="184" w="40" h="20" color="red"></lcars-rectangle>

  <!-- Lower Elbow -->
  <lcars-elbow x="0" y="210" w="200" h="40" color="red" orientation="0">03-975883</lcars-elbow>

  <!-- Middle Bar Segments -->
  <lcars-rectangle x="606" y="210" w="40" h="20" color="yellow"></lcars-rectangle>
  <lcars-rectangle x="652" y="210" w="140" h="10" color="yellow"></lcars-rectangle>
  <lcars-rectangle x="798" y="210" w="400" h="20" color="purple"></lcars-rectangle>
  <lcars-rectangle x="1204" y="210" w="40" h="20" color="orange"></lcars-rectangle>

  <!-- Left Sidebar Rectangles -->
  <lcars-rectangle x="0" y="316" w="200" h="200" color="red" action="print_db">04-785466</lcars-rectangle>
  <lcars-rectangle x="0" y="522" w="200" h="60" color="orange">05-423512</lcars-rectangle>
  <lcars-rectangle x="0" y="588" w="200" h="250" color="orange">06-572983</lcars-rectangle>

  <!-- Control Buttons -->
  <lcars-button x="1502" y="72" w="210" h="50" color="orange" action="debug">(LC+d)ebug 9888-24</lcars-button>
  <lcars-button x="1281" y="73" w="210" h="50" color="blue" action="edit">(LC+e)edit 0129-86</lcars-button>
  <lcars-button x="1501" y="135" w="210" h="50" color="blue" action="reset">(LC+r)eset 7232-83</lcars-button>
  <lcars-button x="1287" y="135" w="210" h="50" color="blue" action="voice_input">Voice Input</lcars-button>
  <!-- <lcars-button x="584" y="120" w="210" h="50" color="yellow" action="load_hypermedia">LOAD HYPERMEDIA</lcars-button> -->

  <!-- Specialized elements -->
  <lcars-entry-list x="232" y="278" w="1598" h="876" color="purple"></lcars-entry-list>
  <lcars-sphere x="1721" y="25" w="170" h="170" color="white" src="resources/earth.png"></lcars-sphere>
</lcars>
